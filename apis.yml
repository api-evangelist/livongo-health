description: Livongo Health was a digital-health company delivering connected chronic-condition management
  for diabetes, hypertension, weight management, and diabetes prevention through cellular-connected
  glucose meters, blood-pressure monitors, and smart scales paired with human health coaching and 24/7
  monitoring. Livongo merged with Teladoc Health in 2020 and now operates as "Livongo by Teladoc Health";
  the standalone livongo.com domain 301-redirects to teladochealth.com/livongo. The brand exposes no
  independent public developer portal, API documentation, or API surface as of this enrichment pass.
